<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Grouply — Set Up Your Profile</title>
  <meta name="description" content="Set up your Grouply profile with a unique username and display name." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/style.css" />

  <script>
    (function() {
      const savedTheme = localStorage.getItem('grouply_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme === 'dark' || (!savedTheme && prefersDark) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();

    window.GROUPLY_CONFIG = {
      SUPABASE_URL:     "https://bhpunicptjxvfyeqdkak.supabase.co",
      SUPABASE_ANON_KEY:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJocHVuaWNwdGp4dmZ5ZXFka2FrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxOTQ1MzEsImV4cCI6MjEwODc3MDUzMX0.2RtwNBFqKexFlnAleo_JdxURI2b0WPKXPCaAX8XjId4",
      API_BASE_URL:     window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
                          ? "http://localhost:5000"
                          : "https://grouply-backend.onrender.com",
    };
  </script>
</head>
<body>

<main class="onboard-page" id="onboard-page">
  <div class="onboard-card">

    <div class="auth-header">
      <div class="brand-logo" style="margin: 0 auto var(--space-4);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </div>
      <h1 class="auth-title">Complete your profile</h1>
      <p class="auth-subtitle">Set your group identity and choose how other members will recognize you.</p>
    </div>

    <!-- Instagram-style Avatar Picker -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:var(--space-2);margin-bottom:var(--space-6)" id="avatar-section">
      <div style="position:relative;cursor:pointer" id="ob-avatar-trigger" title="Click to choose profile photo">
        <div class="avatar avatar-xl" id="avatar-preview" aria-label="Avatar preview" style="background:var(--accent-subtle);color:var(--brand-accent);font-size:2.2rem;font-weight:700;border:3px solid var(--border-color);width:96px;height:96px">
          ?
        </div>
        <div style="position:absolute;bottom:2px;right:2px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);border:2px solid var(--bg-surface)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
          </svg>
        </div>
      </div>
      <input type="file" id="ob-avatar-file" accept="image/*" style="display:none" />
      <input type="hidden" id="ob-avatar-data" />
      <div style="display:flex;gap:var(--space-3);align-items:center">
        <button type="button" class="btn btn-ghost btn-sm" id="ob-choose-photo-btn" style="color:var(--brand);font-weight:600;font-size:0.85rem">
          Choose Profile Photo
        </button>
        <button type="button" class="btn btn-ghost btn-sm hidden" id="ob-remove-photo-btn" style="color:var(--danger);font-size:0.82rem">
          Remove
        </button>
      </div>
    </div>

    <div id="onboard-alert" class="alert" role="alert" aria-live="polite"></div>

    <form id="onboard-form" novalidate style="display:flex;flex-direction:column;gap:var(--space-4)">

      <!-- Display name -->
      <div class="input-group">
        <label for="ob-name">Display name</label>
        <input id="ob-name" type="text" class="input"
               placeholder="Your name or nickname" autocomplete="name" />
        <span class="form-error" id="ob-name-err"></span>
      </div>

      <!-- Username -->
      <div class="input-group">
        <label for="ob-username">Username <span style="color:var(--danger)">*</span></label>
        <input id="ob-username" type="text" class="input"
               placeholder="e.g. alex_group"
               autocomplete="username"
               pattern="[a-z0-9_]{3,30}"
               required />
        <div class="username-status" id="username-status" aria-live="polite"></div>
        <span class="form-error" id="ob-username-err"></span>
      </div>

      <!-- Bio (optional) -->
      <div class="input-group">
        <label for="ob-bio">Bio <span style="color:var(--text-tertiary);font-weight:400">(optional)</span></label>
        <textarea id="ob-bio" class="input"
                  placeholder="Share a short note about what groups you love..."
                  rows="3"
                  style="resize:vertical;min-height:75px"></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="onboard-submit" style="margin-top:var(--space-2)">
        Continue to Grouply
      </button>
    </form>

  </div>
</main>

<script type="module" src="js/onboarding.js"></script>
</body>
</html>
